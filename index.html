<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인천공항 T2 일제검사 승객조회</title>
    <style>
        body { background-color: #1e2128; color: #ffffff; font-family: 'Malgun Gothic', sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        .header-title { font-size: 20px; font-weight: bold; margin-bottom: 5px; color: #e5e7eb; }
        .sub-title { font-size: 13px; color: #9ca3af; margin-bottom: 20px; }
        .today-info { display: inline-block; background-color: #374151; padding: 5px 12px; border-radius: 15px; font-size: 14px; margin-bottom: 15px; color: #60a5fa; font-weight: bold; }
        .result-card { background-color: #2a2d36; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #374151; }
        .flight-info { display: flex; justify-content: space-between; border-bottom: 1px solid #4b5563; padding-bottom: 15px; margin-bottom: 15px; }
        .info-item { display: flex; flex-direction: column; }
        .label { font-size: 12px; color: #9ca3af; margin-bottom: 5px; }
        .value { font-size: 18px; font-weight: bold; }
        .passenger-box { background-color: #1e3a8a; padding: 15px; border-radius: 8px; text-align: center; }
        .passenger-label { font-size: 14px; color: #93c5fd; }
        .passenger-count { font-size: 22px; font-weight: bold; color: white; margin-top: 5px; }
        .refresh-btn { width: 100%; padding: 14px; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .refresh-btn:active { background-color: #1d4ed8; }
        #loading { text-align: center; color: #9ca3af; margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-title">T2 휴대 검역 일정 실시간 조회</div>
        <div class="sub-title">제2여객터미널 입국장 통과 전 일제검사 대상 승객수를 확인합니다.</div>

        <button class="refresh-btn" onclick="fetchFlightData()">🔄 실시간 새로고침</button>
        
        <div id="today-badge" class="today-info">오늘의 대상편을 불러오는 중...</div>
        <div id="loading">데이터를 실시간으로 불러오는 중입니다...</div>
        <div id="results-container"></div>
    </div>

    <script>
        // ★★★ 매주 스케줄 요일별 편명 수정하는 곳 ★★★
        const weeklySchedule = {
            "월": [],
            "화": [],
            "수": [],
            "목": [],
            "금": ["KE842", "KE832", "OZ304", "KE116", "KE2042", "OZ340", "KE834"], 
            "토": ["KE498", "OZ740", "GA878", "KE832", "OZ304", "KL855", "OZ340", "LJ350"],
            "일": ["OZ568", "KE428", "KE656", "OZ302", "KE964", "KE116", "OZ340", "KE834"]
        };
        
        const API_KEY = "JcfNlXoduLGoJddjGco5oTFV3eEWqmoP4fZsQ0mDYZgRQBANOV3qUTfqV0z2hkEojn7K5eNYr3AIkzKvhJRs4w%3D%3D";
        
        async function fetchFlightData() {
            const container = document.getElementById("results-container");
            const loading = document.getElementById("loading");
            const badge = document.getElementById("today-badge");
            
            container.innerHTML = ""; 
            loading.style.display = "block";
            
            try {
                const days = ["일", "월", "화", "수", "목", "금", "토"];
                const today = new Date();
                const todayDayStr = days[today.getDay()];
                
                badge.innerText = `오늘은 ${todayDayStr}요일 입니다 ✈️`;
                
                const targetFlights = weeklySchedule[todayDayStr] || [];
                
                if (targetFlights.length === 0) {
                    loading.style.display = "none";
                    container.innerHTML = `<div style="text-align:center; color:#9ca3af; margin-top:30px;">오늘은 일제검사 대상편이 없습니다.</div>`;
                    return;
                }
                
                // T2 데이터만 1000개 가져옵니다.
                let urlT2 = `https://apis.data.go.kr/B551177/StatusOfArrivals/getArrivalsCongestion?serviceKey=${API_KEY}&type=json&terno=T2&numOfRows=1000`;
                
                const resT2 = await fetch(urlT2);
                const dataT2 = await resT2.json();
                
                // T2 비행기 목록 세팅
                let allFlights = [];
                if(dataT2?.response?.body?.items) {
                    allFlights = dataT2.response.body.items;
                }
                
                for (let flightNo of targetFlights) {
                    
                    const targetData = allFlights.find(item => {
                        const itemString = JSON.stringify(item).toUpperCase();
                        return itemString.includes(flightNo.toUpperCase());
                    });
                    
                    let gate = "확인중";
                    let passengerStr = "조회 불가 (시간 초과/누락)";
                    
                    if(targetData) {
                        gate = targetData.cgntArea || targetData.entGate || targetData.gateNo || "확인중";
                        
                        let kr = targetData.korean || targetData.krnCnt || targetData.koreanCount || 0;
                        let fr = targetData.foreigner || targetData.frnCnt || targetData.foreignerCount || 0;
                        
                        passengerStr = `내국인 ${kr}명 / 외국인 ${fr}명`;
                    }
                    
                    const cardHtml = `
                        <div class="result-card">
                            <div class="flight-info">
                                <div class="info-item">
                                    <span class="label">도착편명</span>
                                    <span class="value">${flightNo}</span>
                                </div>
                                <div class="info-item" style="text-align: right;">
                                    <span class="label">입국장 구역</span>
                                    <span class="value" style="color: #60a5fa;">${gate}</span>
                                </div>
                            </div>
                            <div class="passenger-box">
                                <div class="passenger-label">탑승객 (예상)</div>
                                <div class="passenger-count">${passengerStr}</div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHtml;
                }
            } catch (e) {
                console.error(e);
                badge.innerText = "데이터 처리 중 공공서버 오류가 발생했습니다.";
            } finally {
                loading.style.display = "none";
            }
        }

        window.onload = fetchFlightData;
    </script>
</body>
</html>
