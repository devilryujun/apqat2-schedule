<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T2 검역 관제 (최종 디버그)</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Malgun Gothic', sans-serif; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; }
        .refresh-btn { width: 100%; padding: 15px; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; margin-bottom: 20px; }
        .card { background-color: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #333; }
        .flight-no { font-size: 20px; font-weight: bold; color: #fff; }
        .p-count { font-size: 18px; font-weight: bold; color: #4dabf7; margin-top: 10px; }
        .error-box { background: #2a1111; border: 1px solid #ff4444; padding: 15px; border-radius: 8px; margin-top: 15px; font-size: 14px; }
        textarea { width: 100%; height: 150px; background: #000; color: #0f0; border: 1px solid #444; margin-top: 10px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-top:0;">T2 실시간 관제</h2>
        <button class="refresh-btn" onclick="fetchData()">🔄 데이터 새로고침</button>
        <div id="status" style="margin-bottom: 15px; color: #aaa;">대기 중...</div>
        <div id="results"></div>
    </div>

    <script>
        // ★ 토요일(오늘) 스케줄도 꼭 알맞게 채워주세요!
        const schedulePlan = {
            "월": [], "화": [], "수": [], "목": [], 
            "금": ["KE842", "KE832", "OZ304", "KE116", "KE2042", "OZ340", "KE834"], 
            "토": ["KE498", "OZ740", "GA878", "KE832", "OZ304", "KL855", "OZ340", "LJ350"],
            "일": ["OZ568", "KE428", "KE656", "OZ302", "KE964", "KE116", "OZ340", "KE834"]
        };

        const API_KEY = "JcfNlXoduLGoJddjGco5oTFV3eEWqmoP4fZsQ0mDYZgRQBANOV3qUTfqV0z2hkEojn7K5eNYr3AIkzKvhJRs4w%3D%3D";

        async function fetchData() {
            const results = document.getElementById("results");
            const status = document.getElementById("status");
            results.innerHTML = "";
            status.innerText = "데이터 요청 중...";

            const dayStr = ["일", "월", "화", "수", "목", "금", "토"][new Date().getDay()];
            const targetList = schedulePlan[dayStr] || [];

            if (targetList.length === 0) {
                results.innerHTML = "<div>오늘 대상편이 없습니다. 요일별 스케줄(코드)을 확인하세요.</div>";
                status.innerText = "완료";
                return;
            }

            try {
                const endpoint = `https://apis.data.go.kr/B551177/StatusOfArrivals/getArrivalsCongestion?serviceKey=${API_KEY}&type=json&terno=T2&numOfRows=1000`;
                
                const response = await fetch(endpoint);
                
                // ★ 핵심: 무조건 원본 텍스트로 먼저 받아서 기절 방지
                const rawText = await response.text(); 

                try {
                    // 여기서 JSON 번역을 시도합니다.
                    const json = JSON.parse(rawText);
                    
                    // JSON 번역은 성공했는데, 내용물이 에러(ex: 키 오류, 트래픽 초과)인 경우
                    if (json.response && json.response.header && json.response.header.resultCode !== "00") {
                        throw new Error(json.response.header.resultMsg);
                    }

                    const items = json.response?.body?.items || [];
                    
                    targetList.forEach(flightNo => {
                        const found = items.find(item => JSON.stringify(item).toUpperCase().includes(flightNo.toUpperCase()));
                        let text = "데이터 누락 (또는 0명)";
                        if (found) {
                            let kr = found.korean || found.krnCnt || 0;
                            let fr = found.foreigner || found.frnCnt || 0;
                            text = `내국인 ${kr}명 / 외국인 ${fr}명`;
                        }
                        
                        results.innerHTML += `
                            <div class="card">
                                <div class="flight-no">${flightNo}</div>
                                <div class="p-count">${text}</div>
                            </div>
                        `;
                    });
                    status.innerText = "업데이트 완료";

                } catch (parseError) {
                    // JSON 번역에 실패했다? = 정부 서버가 XML로 에러 텍스트를 뱉었다는 뜻!
                    // 화면에 그 증거를 그대로 출력합니다.
                    results.innerHTML = `
                        <div class="error-box">
                            <b style="color:#ff4444;">🚨 공공데이터 서버 응답 에러</b><br>
                            정부 서버에서 데이터를 주지 않고 아래와 같은 에러를 뱉어냈습니다. (주로 일일 트래픽 초과)<br>
                            <textarea readonly>${rawText}</textarea>
                        </div>
                    `;
                    status.innerText = "서버 측 에러 발생";
                }
            } catch (netError) {
                results.innerHTML = `<div class="error-box">인터넷 연결이 끊겼거나 Vercel 통신 차단입니다.</div>`;
                status.innerText = "네트워크 에러";
            }
        }
        window.onload = fetchData;
    </script>
</body>
</html>
