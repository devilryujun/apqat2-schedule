<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T2 검역 관제 대시보드 (Pro)</title>
    <style>
        :root { --bg-color: #0f1115; --card-bg: #1a1d24; --accent-blue: #3b82f6; --text-main: #f3f4f6; --text-sub: #9ca3af; }
        * { box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Pretendard', 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #333; }
        .title-group h1 { font-size: 24px; margin: 0 0 8px 0; color: #fff; letter-spacing: -0.5px; }
        .title-group p { margin: 0; font-size: 14px; color: var(--text-sub); }
        .last-update { font-size: 13px; color: #10b981; font-weight: bold; }
        
        .control-panel { display: flex; gap: 10px; margin-bottom: 24px; }
        .btn { flex: 1; padding: 16px; border: none; border-radius: 12px; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-primary { background-color: var(--accent-blue); color: white; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
        .btn-primary:active { transform: translateY(2px); }
        .btn-debug { flex: 0.3; background-color: #374151; color: #d1d5db; }
        
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
        .card { background-color: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid #2d313a; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .flight-no { font-size: 22px; font-weight: 800; color: #fff; }
        .gate-badge { background: #374151; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; }
        
        .data-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 15px; }
        .data-row .label { color: var(--text-sub); }
        .data-row .value { font-weight: 700; color: #60a5fa; }
        .total-box { margin-top: 16px; padding-top: 16px; border-top: 1px dashed #444; display: flex; justify-content: space-between; align-items: center; }
        .total-value { font-size: 24px; font-weight: 900; color: #34d399; }
        
        #loading-overlay { display: none; text-align: center; padding: 40px; color: var(--accent-blue); font-weight: bold; }
        
        /* Debug Console */
        #debug-console { display: none; background: #000; color: #0f0; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; margin-top: 20px; overflow-x: auto; max-height: 400px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title-group">
                <h1>T2 검역 관제 대시보드</h1>
                <p id="today-info">오늘의 일제검사 대상편 데이터를 동기화합니다.</p>
            </div>
            <div class="last-update" id="last-update">업데이트 대기중</div>
        </div>

        <div class="control-panel">
            <button class="btn btn-primary" onclick="executeProFetch()">🔄 실시간 관제 동기화</button>
            <button class="btn btn-debug" onclick="toggleDebug()">🛠 데이터 뜯어보기</button>
        </div>

        <div id="loading-overlay">안전한 통신망을 통해 공공데이터를 수신 중입니다...</div>
        <div class="grid-layout" id="dashboard-grid"></div>
        <pre id="debug-console"></pre>
    </div>

    <script>
        // ★ 3교대 패턴이나 요일별로 필요한 T2 대상 편명을 이곳에 기입합니다.
        const schedulePlan = {
            "월": [], "화": [], "수": [], "목": [], 
            "금": ["KE842", "KE832", "OZ304", "KE116", "KE2042", "OZ340", "KE834"], 
            "토": ["KE498", "OZ740", "GA878", "KE832", "OZ304", "KL855", "OZ340", "LJ350"],
            "일": ["OZ568", "KE428", "KE656", "OZ302", "KE964", "KE116", "OZ340", "KE834"]
        };

        const RAW_API_KEY = "JcfNlXoduLGoJddjGco5oTFV3eEWqmoP4fZsQ0mDYZgRQBANOV3qUTfqV0z2hkEojn7K5eNYr3AIkzKvhJRs4w%3D%3D";
        let rawServerData = null; // 디버깅용 데이터 보관

        // 문자열 정규화 함수 (공백 및 특수문자 제거로 매칭률 100% 확보)
        const normalizeString = (str) => String(str).replace(/[^a-zA-Z0-9]/g, '').toUpperCase();

        async function executeProFetch() {
            const grid = document.getElementById("dashboard-grid");
            const loader = document.getElementById("loading-overlay");
            const updateTime = document.getElementById("last-update");
            const consoleBox = document.getElementById("debug-console");
            
            grid.innerHTML = "";
            consoleBox.style.display = "none";
            loader.style.display = "block";
            updateTime.innerText = "통신 중...";

            try {
                const dayStr = ["일", "월", "화", "수", "목", "금", "토"][new Date().getDay()];
                document.getElementById("today-info").innerText = `기준일: ${dayStr}요일 (제2여객터미널 전용)`;
                
                const targetList = schedulePlan[dayStr] || [];
                if (targetList.length === 0) {
                    grid.innerHTML = `<div style="color: #9ca3af; padding: 20px;">금일 일제검사 대상 편명이 없습니다.</div>`;
                    loader.style.display = "none";
                    updateTime.innerText = "스탠바이 완료";
                    return;
                }

                // API 키 안전 인코딩 로직 적용
                const safeKey = encodeURIComponent(decodeURIComponent(RAW_API_KEY));
                const endpoint = `https://apis.data.go.kr/B551177/StatusOfArrivals/getArrivalsCongestion?serviceKey=${safeKey}&type=json&terno=T2&numOfRows=1000`;

                const response = await fetch(endpoint);
                if (!response.ok) throw new Error("서버 응답 오류");
                
                const jsonResponse = await response.json();
                rawServerData = jsonResponse; // 디버그용 원본 저장
                
                const apiItems = jsonResponse?.response?.body?.items || [];

                targetList.forEach(flightNo => {
                    const normalizedTarget = normalizeString(flightNo);
                    
                    // JSON의 모든 value를 스캔하여 편명이 포함된 객체를 찾아내는 강력한 탐색기
                    const matchedData = apiItems.find(item => {
                        return Object.values(item).some(val => normalizeString(val).includes(normalizedTarget));
                    });

                    let gate = "미확인";
                    let krn = 0, frn = 0;

                    if (matchedData) {
                        // 공공데이터 속성명 변동(예외)을 모두 커버하는 방어적 변수 할당
                        gate = matchedData.cgntArea || matchedData.entGate || matchedData.gateNo || "미확인";
                        krn = Number(matchedData.korean || matchedData.krnCnt || matchedData.koreanCount || 0);
                        frn = Number(matchedData.foreigner || matchedData.frnCnt || matchedData.foreignerCount || 0);
                    }

                    const isDataEmpty = !matchedData || (krn === 0 && frn === 0);
                    const statusText = isDataEmpty ? "데이터 수신 대기 (또는 0명)" : "집계 완료";
                    const statusColor = isDataEmpty ? "#f59e0b" : "#34d399";

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="flight-no">${flightNo}</span>
                            <span class="gate-badge">${gate} 구역</span>
                        </div>
                        <div class="data-row">
                            <span class="label">내국인</span>
                            <span class="value">${krn} 명</span>
                        </div>
                        <div class="data-row">
                            <span class="label">외국인</span>
                            <span class="value">${frn} 명</span>
                        </div>
                        <div class="total-box">
                            <span class="label" style="color:${statusColor}">${statusText}</span>
                            <span class="total-value">${krn + frn} 명</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                const now = new Date();
                updateTime.innerText = `최종 갱신: ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;

            } catch (error) {
                console.error(error);
                grid.innerHTML = `<div style="color: #ef4444; padding: 20px;">네트워크 또는 공공 포털 서버 오류가 발생했습니다. 잠시 후 다시 시도하십시오.</div>`;
                updateTime.innerText = "업데이트 실패";
            } finally {
                loader.style.display = "none";
            }
        }

        // 관리자 전용 디버깅 툴
        function toggleDebug() {
            const consoleBox = document.getElementById("debug-console");
            if (consoleBox.style.display === "block") {
                consoleBox.style.display = "none";
            } else {
                consoleBox.style.display = "block";
                if (!rawServerData) {
                    consoleBox.innerText = "먼저 [실시간 관제 동기화]를 실행하여 데이터를 수신하십시오.";
                } else {
                    // 상위 3개 데이터만 샘플로 출력하여 속성명 구조 파악
                    const sampleItems = rawServerData?.response?.body?.items?.slice(0, 3) || "데이터 배열이 존재하지 않습니다.";
                    consoleBox.innerText = "[디버그 모드] 공공 API 원본 JSON 구조 샘플 (최상위 3건):\n\n" + JSON.stringify(sampleItems, null, 2);
                }
            }
        }

        // 초기 자동 실행
        window.onload = executeProFetch;
    </script>
</body>
</html>
